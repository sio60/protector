<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보호필름 붙이기</title>
<meta name="description" content="화면에 보호필름을 붙입니다. 잘 안 붙습니다.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="보호필름 붙이기">
<meta property="og:description" content="화면에 보호필름을 붙입니다. 잘 안 붙습니다.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="보호필름">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&family=Chakra+Petch:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#EDEFF2;
  --muted:#585F67;
  --line:#282C32;
  --red:#FF453A;
  --green:#30D97E;
  --kr:"Gothic A1","Malgun Gothic",sans-serif;
  --num:"Chakra Petch",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#000;color:var(--ink);
  font-family:var(--kr);overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ── 화면 = 필름이 붙는 곳 ───────────────────────────── */
/* 보호필름은 원래 검은 화면에 놓고 붙인다. 티가 잘 보이라고. */
/* 필름은 화면 끝에서 끝까지 덮는다. 버튼은 그 위에 얹힌다. */
#screen{
  position:fixed;inset:0;
  overflow:hidden;touch-action:none;
  background:#000;
  isolation:isolate;          /* screen 합성이 바깥으로 새지 않게 */
}

/* 필름 한 장 — 화면 전체 */
#film{
  position:absolute;inset:0;
  opacity:0;transform:translateY(-104%);
  transition:opacity .16s ease, transform .72s cubic-bezier(.20,.86,.26,1);
  pointer-events:none;
}
#film.on{
  opacity:1;
  transform:rotate(var(--tilt,0deg));
}
/* 붙어 있는 동안 남는 유리막 */
#film .sheen{
  position:absolute;inset:0;
  background:linear-gradient(118deg,
    rgba(214,233,255,.155) 0 9%,
    rgba(214,233,255,.052) 21%,
    rgba(255,255,255,.014) 41% 61%,
    rgba(186,214,246,.062) 81%,
    rgba(206,229,255,.140) 100%);
  box-shadow:inset 0 0 0 1px rgba(150,175,205,.42),
             inset 0 0 90px rgba(120,150,185,.10);
}
/* 붙는 순간 화면을 한 번 훑고 지나가는 빛 */
#film .glare{
  position:absolute;top:-35%;bottom:-35%;left:-70%;width:62%;
  background:linear-gradient(100deg,
    rgba(255,255,255,0),
    rgba(226,240,255,.17) 45%,
    rgba(255,255,255,.22) 52%,
    rgba(226,240,255,.17) 59%,
    rgba(255,255,255,0));
  opacity:0;
}
#film.on .glare{animation:sweep 1.1s cubic-bezier(.32,.7,.3,1) .16s 1 both}
@keyframes sweep{
  0%  {opacity:0;  transform:translateX(0) rotate(7deg)}
  10% {opacity:1}
  86% {opacity:1}
  100%{opacity:0;  transform:translateX(330%) rotate(7deg)}
}

/* 결함은 필름이 아니라 화면 위에 얹는다.
   검은 배경 스프라이트라 screen 합성으로 검정만 지워진다. */
#defects{position:absolute;inset:0;pointer-events:none}
.defect{
  position:absolute;
  transform-origin:center;
  mix-blend-mode:screen;
  opacity:0;
  transition:opacity .28s ease .12s;
}
.defect.in{opacity:1}
.defect img{display:block;width:100%;height:auto}

/* ── 아래 바 ──────────────────────────────────────── */
#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  padding:0 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.88) 34%,#000 62%);
}
#verdict{
  height:30px;line-height:30px;text-align:center;
  font-size:15px;font-weight:700;color:var(--red);
  opacity:0;transform:translateY(4px);
  transition:opacity .22s ease, transform .22s ease;
}
#verdict.show{opacity:1;transform:translateY(0)}
#verdict.good{color:var(--green)}

.controls{display:flex;gap:9px;max-width:460px;margin:8px auto 0}
button{
  flex:1;padding:15px 10px;border-radius:14px;
  border:1px solid var(--line);background:#15181C;color:var(--ink);
  font-family:var(--kr);font-size:15px;font-weight:700;cursor:pointer;
  transition:transform .1s ease,opacity .2s ease;
}
button.primary{background:#EDEFF2;color:#0A0C0E;border-color:#EDEFF2}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.3;cursor:default}
button:focus-visible{outline:3px solid #3B7DD8;outline-offset:2px}

#stats{
  position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;
  display:flex;justify-content:center;gap:20px;
  font-size:11px;color:var(--muted);letter-spacing:.04em;
  pointer-events:none;z-index:5;
}
#stats b{font-family:var(--num);font-size:13px;color:#9AA1AA;font-weight:600;
  font-variant-numeric:tabular-nums;margin-left:5px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="stats">
  <span>시도<b id="sTry">0</b></span>
  <span>버린 필름<b id="sWaste">0</b></span>
  <span>성공<b id="sWin">0</b></span>
</div>

<div id="screen">
  <div id="film"><div class="sheen"></div><div class="glare"></div></div>
  <div id="defects"></div>
</div>

<div id="bar">
  <div id="verdict"></div>
  <div class="controls">
    <button class="primary" id="apply">붙이기</button>
    <button id="peel" disabled>다시 붙이기</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var screenEl = document.getElementById('screen');
  var film = document.getElementById('film');
  var layer = document.getElementById('defects');
  var verdict = document.getElementById('verdict');
  var applyBtn = document.getElementById('apply');
  var peelBtn = document.getElementById('peel');
  var sTry = document.getElementById('sTry');
  var sWaste = document.getElementById('sWaste');
  var sWin = document.getElementById('sWin');
  var barEl = document.getElementById('bar');

  // 필름은 화면을 다 덮지만, 결함은 통계·버튼 뒤로 숨지 않게 둔다
  function topLimit() { return 34; }
  function botLimit() { return screenEl.clientHeight - barEl.offsetHeight; }

  // 실패: [문구, 스프라이트 번호, 자리]
  //   c=가운데 · e=가장자리 · r=아무데나
  // 스프라이트 1~26 과 한 줄씩 그대로 맞물린다
  var FAILS = [
    ['큰 기포가 가운데 남았어요',           1,  'c'],
    ['작은 기포가 하나 남았어요',           2,  'r'],
    ['기포가 옆으로 길어졌어요',            3,  'r'],
    ['기포 두 개가 붙어 있었어요',          4,  'r'],
    ['기포 모양이 울퉁불퉁해졌어요',        5,  'r'],
    ['작은 기포가 같이 생겼어요',           6,  'r'],
    ['큰 기포가 둘로 갈라졌어요',           7,  'c'],
    ['기포 안이 뿌옇게 보였어요',           8,  'c'],
    ['기포가 한쪽으로 밀렸어요',            9,  'e'],
    ['잔기포가 여러 개 생겼어요',           10, 'r'],
    ['머리카락이 길게 들어갔어요',          11, 'r'],
    ['짧은 머리카락이 들어갔어요',          12, 'r'],
    ['속눈썹이 필름 안에 들어갔어요',       13, 'r'],
    ['흰 섬유가 필름 안에 들어갔어요',      14, 'r'],
    ['실밥이 필름 안에 들어갔어요',         15, 'r'],
    ['색실밥이 필름 안에 들어갔어요',       16, 'r'],
    ['검은 먼지가 필름 안에 들어갔어요',    17, 'r'],
    ['흰 먼지가 필름 안에 들어갔어요',      18, 'r'],
    ['모래알이 필름 안에 들어갔어요',       19, 'r'],
    ['보풀이 필름 안에 들어갔어요',         20, 'r'],
    ['딱딱한 이물이 필름 안에 들어갔어요',  21, 'r'],
    ['지문이 선명하게 찍혔어요',            22, 'c'],
    ['지문이 희미하게 남았어요',            23, 'r'],
    ['지문이 반쯤 번졌어요',                24, 'r'],
    ['손자국이 세 줄 남았어요',             25, 'r'],
    ['문지른 자국이 둥글게 남았어요',       26, 'c']
  ];
  var WINS = [
    '기포가 전부 빠졌어요',
    '먼지가 아무것도 없어요',
    '지문이 남지 않았어요',
    '가장자리까지 붙었어요',
    '이번에는 그냥 붙었어요',
    '찾아볼 게 없었어요'
  ];

  // 스프라이트 가로/세로 비율
  var AR = [0,
    1.060, 1.053, 2.228, 1.742, 1.315, 1.090, 1.173, 1.107, 2.371, 1.560,
    1.341, 1.362, 1.364, 1.145, 1.211, 0.920,
    0.931, 0.961, 1.020, 1.128, 0.969,
    0.715, 0.693, 0.734, 1.089, 0.974];

  // 긴 변 길이. 화면의 짧은 변을 1로 본다.
  var SIZE = [null,
    [.42,.54], [.15,.21], [.30,.42], [.30,.40], [.30,.40], [.30,.40], [.30,.40], [.32,.42], [.32,.44], [.34,.46],
    [.34,.48], [.24,.34], [.26,.36], [.26,.36], [.26,.36], [.20,.28],
    [.09,.14], [.08,.13], [.09,.14], [.22,.30], [.09,.14],
    [.34,.46], [.34,.46], [.34,.46], [.36,.48], [.34,.46]];

  var tries = 0, wasted = 0, wins = 0;
  var applied = false;
  var nodes = [];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[(Math.random() * a.length) | 0]; }
  function src(id) { return 'sprites/' + (id < 10 ? '0' + id : id) + '.png'; }

  // 미리 받아둔다. 안 그러면 판정 순간에 빈 화면이 보인다.
  (function preload() {
    for (var i = 1; i <= 26; i++) { var im = new Image(); im.src = src(i); }
  })();

  function place(id, pos) {
    var w = screenEl.clientWidth;
    var t = topLimit(), b = botLimit(), h = b - t;
    var base = Math.min(w, h);
    var el = document.createElement('div');
    el.className = 'defect';

    var ar = AR[id];
    var long = base * rand(SIZE[id][0], SIZE[id][1]);
    var size = ar >= 1 ? long : long * ar;   // 세로로 긴 놈은 폭을 줄인다
    var boxH = size / ar;

    var x, y;
    var mx = size / 2 + 6, my = boxH / 2 + 6;
    if (pos === 'c') {
      x = w / 2 + rand(-w * 0.10, w * 0.10);
      y = t + h / 2 + rand(-h * 0.10, h * 0.10);
    } else if (pos === 'e') {
      var side = (Math.random() * 4) | 0;
      if (side === 0) { x = rand(mx, w - mx); y = t + rand(my, h * 0.22); }
      else if (side === 1) { x = rand(mx, w - mx); y = t + rand(h * 0.78, h - my); }
      else if (side === 2) { x = rand(mx, w * 0.24); y = t + rand(my, h - my); }
      else { x = rand(w * 0.76, w - mx); y = t + rand(my, h - my); }
    } else {
      x = rand(w * 0.18, w * 0.82);
      y = t + rand(h * 0.16, h * 0.84);
    }
    x = Math.max(mx, Math.min(w - mx, x));
    y = Math.max(t + my, Math.min(b - my, y));

    el.style.width = size + 'px';
    el.style.left = (x - size / 2) + 'px';
    el.style.top = (y - boxH / 2) + 'px';
    el.style.transform = 'rotate(' + rand(0, 360).toFixed(1) + 'deg)';

    var img = document.createElement('img');
    img.src = src(id);
    img.alt = '';
    el.appendChild(img);
    layer.appendChild(el);
    nodes.push(el);
    void el.offsetWidth;        // 리플로를 한 번 강제해야 페이드가 먹는다
    el.classList.add('in');
  }

  function clearDefects() {
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].parentNode) nodes[i].parentNode.removeChild(nodes[i]);
    }
    nodes = [];
  }

  function apply() {
    tries++; sTry.textContent = tries;
    applied = true;
    applyBtn.disabled = true;
    peelBtn.disabled = false;
    verdict.classList.remove('show', 'good');
    clearDefects();

    var win = Math.random() < 0.05;
    var entry = win ? null : pick(FAILS);

    // 붙일 때마다 아주 살짝 비뚤어진다
    film.style.setProperty('--tilt', rand(-0.35, 0.35).toFixed(2) + 'deg');
    film.classList.add('on');

    setTimeout(function () {
      if (win) {
        wins++; sWin.textContent = wins;
        say(pick(WINS), true);
        return;
      }
      place(entry[1], entry[2]);
      say(entry[0], false);
    }, 900);
  }

  // 떼고 끝이 아니라, 떼자마자 새 필름을 붙인다
  function peel() {
    film.classList.remove('on');
    verdict.classList.remove('show', 'good');
    applied = false;
    wasted++; sWaste.textContent = wasted;
    applyBtn.disabled = true;
    peelBtn.disabled = true;
    setTimeout(function () {
      clearDefects();
      apply();
    }, 340);
  }

  function say(t, good) {
    verdict.textContent = t;
    verdict.classList.toggle('good', !!good);
    verdict.classList.add('show');
  }

  // 주소창까지 걷어낸다. 진짜 내 화면처럼 보이라고.
  function goFull() {
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    var el = document.documentElement;
    var f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!f) return;
    try {
      var r = f.call(el, { navigationUI: 'hide' });
      if (r && r.catch) r.catch(function () {});
    } catch (e) {}
  }

  applyBtn.addEventListener('click', function () { goFull(); apply(); });
  peelBtn.addEventListener('click', function () { goFull(); peel(); });

  // 기포를 밀어봐도 그 자리에서 미끄러지기만 한다
  var dragging = null, ox = 0, oy = 0;
  function pt(e) { var p = e.touches ? e.touches[0] : e; return { x: p.clientX, y: p.clientY }; }
  screenEl.addEventListener('pointerdown', function (e) {
    if (!applied) return;
    var best = null, bd = 1e9;
    var p = pt(e);
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      var d = Math.hypot(r.left + r.width / 2 - p.x, r.top + r.height / 2 - p.y);
      if (d < Math.max(r.width, r.height) * 0.7 && d < bd) { bd = d; best = nodes[i]; }
    }
    if (!best) return;
    dragging = best;
    var rr = best.getBoundingClientRect();
    ox = p.x - (rr.left + rr.width / 2);
    oy = p.y - (rr.top + rr.height / 2);
    screenEl.setPointerCapture(e.pointerId);
  });
  screenEl.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = pt(e);
    var w = dragging.offsetWidth, h = dragging.offsetHeight;
    var nx = p.x - ox, ny = p.y - oy;
    // 가장자리 밖으로는 못 나간다. 아무리 밀어도.
    var m = 6;
    nx = Math.max(m + w / 2, Math.min(screenEl.clientWidth - m - w / 2, nx));
    ny = Math.max(topLimit() + m + h / 2, Math.min(botLimit() - m - h / 2, ny));
    dragging.style.left = (nx - w / 2) + 'px';
    dragging.style.top = (ny - h / 2) + 'px';
  });
  function endDrag() { dragging = null; }
  screenEl.addEventListener('pointerup', endDrag);
  screenEl.addEventListener('pointercancel', endDrag);
})();
</script>
</body>
</html>
